<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG PDF Intelligence Studio</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#090d16',
                            950: '#030712',
                        },
                        cyan: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                            900: '#083344',
                        },
                        indigo: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(34, 211, 238, 0.2), 0 0 20px rgba(34, 211, 238, 0.1)' },
                            '100%': { boxShadow: '0 0 15px rgba(34, 211, 238, 0.4), 0 0 30px rgba(34, 211, 238, 0.2)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbar for cyber aesthetic */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        .code-block {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col overflow-x-hidden selection:bg-cyan-500 selection:text-slate-950">
    <div id="root" class="flex-1 flex flex-col min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Icon wrapper using lucide
        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.setAttribute('width', size);
                    i.setAttribute('height', size);
                    if (className) i.className = className;
                    iconRef.current.appendChild(i);
                    lucide.createIcons({
                        attrs: {
                            strokeWidth: 2
                        },
                        nameMap: {
                            [name]: i
                        }
                    });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        // Simulated Mock Response Logic for standalone demo mode
        const getMockRAGResponse = (query, docName) => {
            const q = query.toLowerCase();
            if (q.includes("timeline") || q.includes("when") || q.includes("schedule")) {
                return {
                    answer: "According to the Artemis Plan, NASA targets landing astronauts on the lunar South Pole in 2024 (Artemis III). Prior to this, Artemis I will test the uncrewed Orion spacecraft and Space Launch System (SLS) rocket, followed by Artemis II carrying a crewed test flight in 2023.",
                    citations: [4, 12, 18]
                };
            } else if (q.includes("artemis") || q.includes("mission") || q.includes("goal")) {
                return {
                    answer: "The primary objective of the Artemis program is to establish sustainable human exploration on the Moon by the end of the decade, using the lunar surface as a stepping stone to send the first astronauts to Mars.",
                    citations: [2, 5]
                };
            } else if (q.includes("sls") || q.includes("rocket") || q.includes("orion")) {
                return {
                    answer: "The Space Launch System (SLS) is NASA's super heavy-lift launch vehicle designed to propel the Orion spacecraft beyond Low Earth Orbit toward the Moon, generating up to 8.8 million pounds of maximum thrust.",
                    citations: [8, 15]
                };
            } else {
                return {
                    answer: "I don't know based on the provided document.",
                    citations: []
                };
            }
        };

        function App() {
            // Configuration & State
            const [backendUrl, setBackendUrl] = useState("http://localhost:8000");
            const [isDemoMode, setIsDemoMode] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [topK, setTopK] = useState(3);

            // Document State
            const [activeDoc, setActiveDoc] = useState(null); // { filename, doc_name, pageCount, chunks }
            const [isUploading, setIsUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploadStatusText, setUploadStatusText] = useState("");

            // Chat State
            const [messages, setMessages] = useState([
                {
                    id: 1,
                    sender: "assistant",
                    text: "Hello! Upload a PDF document in the sidebar to extract text, vector embeddings, and diagrams into PostgreSQL. Once ingested, ask any question and I'll answer with exact page citations.",
                    citations: [],
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
            ]);
            const [inputQuery, setInputQuery] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);

            const chatEndRef = useRef(null);
            const fileInputRef = useRef(null);

            // Auto-scroll chat window
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isGenerating]);

            // Handle PDF File Upload
            const handleFileUpload = async (file) => {
                if (!file || !file.name.endsWith('.pdf')) {
                    alert('Please select a valid PDF file.');
                    return;
                }

                setIsUploading(true);
                setUploadProgress(15);
                setUploadStatusText("Extracting PDF text & visual blocks...");

                const docNameClean = file.name.replace(/\.[^/.]+$/, "");

                if (isDemoMode) {
                    // Simulated upload delay for demo mode
                    setTimeout(() => setUploadProgress(50), 400);
                    setTimeout(() => {
                        setUploadProgress(90);
                        setUploadStatusText("Generating embeddings & loading into vector store...");
                    }, 800);
                    setTimeout(() => {
                        setUploadProgress(100);
                        setActiveDoc({
                            filename: file.name,
                            doc_name: docNameClean,
                            size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                            chunksCount: 74,
                            pages: "36 pages"
                        });
                        setIsUploading(false);
                        setUploadStatusText("");

                        // Add system notice to chat
                        setMessages(prev => [...prev, {
                            id: Date.now(),
                            sender: "system",
                            text: `Document "${file.name}" ready! Text chunks and vector embeddings stored.`,
                            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        }]);
                    }, 1400);
                    return;
                }

                // Live API Backend Upload
                const formData = new FormData();
                formData.append('file', file);

                try {
                    setUploadProgress(40);
                    setUploadStatusText("Processing document & encoding vectors...");

                    const response = await fetch(`${backendUrl}/upload`, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Failed to upload and ingest PDF.');
                    }

                    const data = await response.json();
                    setUploadProgress(100);

                    setActiveDoc({
                        filename: data.filename || file.name,
                        doc_name: data.doc_name || docNameClean,
                        size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                        chunksCount: "Indexed",
                        pages: "Complete"
                    });

                    setMessages(prev => [...prev, {
                        id: Date.now(),
                        sender: "system",
                        text: `Successfully ingested "${file.name}" into vector database. Ready for Q&A!`,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                } catch (err) {
                    console.error("Upload error:", err);
                    alert(`Upload Error: ${err.message}. Make sure your FastAPI backend is running at ${backendUrl} or switch to Demo Mode.`);
                } finally {
                    setIsUploading(false);
                    setUploadStatusText("");
                }
            };

            // Drag and drop handlers
            const handleDrop = (e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFileUpload(e.dataTransfer.files[0]);
                }
            };

            // Handle Question Submission
            const handleSendQuery = async (e) => {
                e.preventDefault();
                if (!inputQuery.trim()) return;

                if (!activeDoc) {
                    alert("Please upload a PDF document first before asking questions.");
                    return;
                }

                const userText = inputQuery.trim();
                const userMsg = {
                    id: Date.now(),
                    sender: "user",
                    text: userText,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setMessages(prev => [...prev, userMsg]);
                setInputQuery("");
                setIsGenerating(true);

                if (isDemoMode) {
                    setTimeout(() => {
                        const result = getMockRAGResponse(userText, activeDoc.doc_name);
                        setMessages(prev => [...prev, {
                            id: Date.now() + 1,
                            sender: "assistant",
                            text: result.answer,
                            citations: result.citations,
                            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        }]);
                        setIsGenerating(false);
                    }, 900);
                    return;
                }

                // Live API Call to /chat
                try {
                    const response = await fetch(`${backendUrl}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: userText,
                            doc_name: activeDoc.doc_name,
                            top_k: parseInt(topK)
                        }),
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.detail || 'RAG inference request failed.');
                    }

                    const data = await response.json();
                    setMessages(prev => [...prev, {
                        id: Date.now() + 1,
                        sender: "assistant",
                        text: data.answer,
                        citations: data.citations || [],
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                } catch (err) {
                    console.error("Chat Error:", err);
                    setMessages(prev => [...prev, {
                        id: Date.now() + 1,
                        sender: "assistant",
                        text: `Error reaching RAG backend: ${err.message}. Please verify FastAPI is running at ${backendUrl}.`,
                        citations: [],
                        isError: true,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                } finally {
                    setIsGenerating(false);
                }
            };

            // Quick preset demo loader
            const loadSampleDemoDoc = () => {
                setIsDemoMode(true);
                setActiveDoc({
                    filename: "artemis_plan-20200921.pdf",
                    doc_name: "artemis_plan-20200921",
                    size: "14.2 MB",
                    chunksCount: 128,
                    pages: "74 pages"
                });
                setMessages([
                    {
                        id: 1,
                        sender: "assistant",
                        text: "Loaded NASA Artemis Plan PDF sample in Demo Mode! Try asking questions like 'What is the mission timeline?' or 'What is the SLS rocket?'",
                        citations: [1, 2],
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }
                ]);
            };

            return (
                <div className="flex-1 flex flex-col h-screen bg-slate-950 text-slate-100 overflow-hidden">
                    {/* Top Navigation Header */}
                    <header className="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-6 flex items-center justify-between z-10 shrink-0">
                        <div className="flex items-center space-x-3">
                            <div className="p-2 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-lg shadow-lg shadow-cyan-500/20">
                                <Icon name="file-text" size={22} className="text-white" />
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight tracking-wide flex items-center gap-2">
                                    RAG Intelligence Studio
                                    <span className="text-xs font-mono font-medium px-2 py-0.5 rounded border border-cyan-500/30 bg-cyan-950/50 text-cyan-400">
                                        FAISS + pgvector
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400">Grounded Document Q&A with Page Citations</p>
                            </div>
                        </div>

                        {/* Top Controls */}
                        <div className="flex items-center space-x-3">
                            {/* Mode Indicator Button */}
                            <button
                                onClick={() => setIsDemoMode(!isDemoMode)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-mono font-medium flex items-center space-x-2 transition-all border ${
                                    isDemoMode
                                        ? 'bg-amber-500/10 text-amber-400 border-amber-500/30 hover:bg-amber-500/20'
                                        : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20'
                                }`}
                            >
                                <span className={`w-2 h-2 rounded-full ${isDemoMode ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400 animate-pulse'}`}></span>
                                <span>{isDemoMode ? 'Demo Mode (Offline)' : 'Live FastAPI Backend'}</span>
                            </button>

                            {/* Settings Drawer Button */}
                            <button
                                onClick={() => setShowSettings(!showSettings)}
                                className="p-2 text-slate-400 hover:text-slate-100 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition"
                                title="System Configuration"
                            >
                                <Icon name="settings" size={18} />
                            </button>
                        </div>
                    </header>

                    {/* Main Workspace Body */}
                    <div className="flex-1 flex overflow-hidden">

                        {/* Sidebar: Document Upload & Status */}
                        <aside className="w-80 border-r border-slate-800 bg-slate-900/50 flex flex-col shrink-0">

                            {/* Upload Area */}
                            <div className="p-4 border-b border-slate-800">
                                <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Document Ingestion</h2>

                                <div
                                    onDragOver={(e) => e.preventDefault()}
                                    onDrop={handleDrop}
                                    onClick={() => fileInputRef.current?.click()}
                                    className={`border-2 border-dashed rounded-xl p-5 text-center cursor-pointer transition-all ${
                                        isUploading
                                            ? 'border-cyan-500 bg-cyan-950/20'
                                            : 'border-slate-700 hover:border-cyan-500/60 hover:bg-slate-800/50 bg-slate-950/40'
                                    }`}
                                >
                                    <input
                                        type="file"
                                        ref={fileInputRef}
                                        onChange={(e) => e.target.files?.[0] && handleFileUpload(e.target.files[0])}
                                        accept=".pdf"
                                        className="hidden"
                                    />

                                    <div className="w-12 h-12 mx-auto rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-cyan-400 mb-3 group-hover:scale-110 transition">
                                        <Icon name="upload-cloud" size={24} />
                                    </div>
                                    <p className="text-sm font-medium text-slate-200">Click or drag PDF here</p>
                                    <p className="text-xs text-slate-500 mt-1">Parses text, graphics & vectors</p>
                                </div>

                                {/* Upload Progress Bar */}
                                {isUploading && (
                                    <div className="mt-4">
                                        <div className="flex justify-between text-xs text-slate-400 mb-1 font-mono">
                                            <span>Processing PDF</span>
                                            <span>{uploadProgress}%</span>
                                        </div>
                                        <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div
                                                className="h-full bg-gradient-to-r from-cyan-500 to-indigo-500 transition-all duration-300"
                                                style={{ width: `${uploadProgress}%` }}
                                            ></div>
                                        </div>
                                        <p className="text-[11px] text-cyan-400 mt-2 font-mono flex items-center gap-1">
                                            <Icon name="loader-2" size={12} className="animate-spin" />
                                            {uploadStatusText}
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* Active Document Status */}
                            <div className="p-4 border-b border-slate-800 flex-1 overflow-y-auto">
                                <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Active Context Document</h2>

                                {activeDoc ? (
                                    <div className="bg-slate-950 border border-cyan-500/30 rounded-xl p-4 shadow-lg shadow-cyan-950/30 relative group">
                                        <div className="flex items-start space-x-3">
                                            <div className="p-2.5 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg">
                                                <Icon name="file-type-2" size={24} />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h3 className="font-semibold text-sm text-slate-100 truncate" title={activeDoc.filename}>
                                                    {activeDoc.filename}
                                                </h3>
                                                <p className="text-xs text-slate-400 font-mono mt-0.5">{activeDoc.size}</p>
                                            </div>
                                        </div>

                                        {/* Doc Stats */}
                                        <div className="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-slate-800/80 text-xs font-mono">
                                            <div className="bg-slate-900/80 p-2 rounded border border-slate-800">
                                                <span className="text-slate-500 block text-[10px]">DOC ID</span>
                                                <span className="text-cyan-400 font-bold truncate block">{activeDoc.doc_name}</span>
                                            </div>
                                            <div className="bg-slate-900/80 p-2 rounded border border-slate-800">
                                                <span className="text-slate-500 block text-[10px]">CHUNKS</span>
                                                <span className="text-indigo-400 font-bold">{activeDoc.chunksCount}</span>
                                            </div>
                                        </div>

                                        <button
                                            onClick={() => setActiveDoc(null)}
                                            className="mt-3 w-full py-1.5 text-xs text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded transition border border-transparent hover:border-red-500/20 flex items-center justify-center gap-1"
                                        >
                                            <Icon name="trash-2" size={13} />
                                            Clear Document Context
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center py-8 text-slate-500 border border-dashed border-slate-800 rounded-xl">
                                        <Icon name="file-question" size={32} className="mx-auto mb-2 opacity-50" />
                                        <p className="text-xs">No active document uploaded</p>
                                        <button
                                            onClick={loadSampleDemoDoc}
                                            className="mt-3 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 rounded-lg text-xs font-medium transition"
                                        >
                                            Load Sample NASA PDF
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Tech Stack Footer Info */}
                            <div className="p-4 bg-slate-950/60 border-t border-slate-800/80 text-xs text-slate-400 font-mono">
                                <div className="flex justify-between items-center mb-1">
                                    <span className="text-slate-500">Vector Model:</span>
                                    <span className="text-cyan-400">all-MiniLM-L6-v2</span>
                                </div>
                                <div className="flex justify-between items-center mb-1">
                                    <span className="text-slate-500">Vector Database:</span>
                                    <span className="text-indigo-400">PostgreSQL (pgvector)</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-500">LLM Engine:</span>
                                    <span className="text-slate-300">Qwen 2.5 (Local)</span>
                                </div>
                            </div>
                        </aside>

                        {/* Main Chat Conversation Workspace */}
                        <main className="flex-1 flex flex-col bg-slate-950 relative">

                            {/* Settings Drawer Overlay */}
                            {showSettings && (
                                <div className="absolute top-0 right-0 w-80 bg-slate-900 border-l border-b border-slate-800 p-5 z-20 shadow-2xl rounded-bl-2xl">
                                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                                        <h3 className="font-bold text-sm flex items-center gap-2 text-slate-200">
                                            <Icon name="sliders" size={16} className="text-cyan-400" />
                                            Backend Parameters
                                        </h3>
                                        <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white">
                                            <Icon name="x" size={16} />
                                        </button>
                                    </div>

                                    <div className="space-y-4 text-xs font-mono">
                                        <div>
                                            <label className="text-slate-400 block mb-1">FastAPI Backend Endpoint</label>
                                            <input
                                                type="text"
                                                value={backendUrl}
                                                onChange={(e) => setBackendUrl(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-200 focus:border-cyan-500 outline-none"
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between mb-1">
                                                <label className="text-slate-400">Top-K Chunk Retrieval</label>
                                                <span className="text-cyan-400 font-bold">{topK}</span>
                                            </div>
                                            <input
                                                type="range"
                                                min="1"
                                                max="10"
                                                value={topK}
                                                onChange={(e) => setTopK(e.target.value)}
                                                className="w-full accent-cyan-500 bg-slate-800 rounded cursor-pointer"
                                            />
                                            <p className="text-[10px] text-slate-500 mt-1">Number of nearest neighbor context blocks to inject.</p>
                                        </div>

                                        <div className="pt-2 border-t border-slate-800">
                                            <label className="flex items-center space-x-2 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={isDemoMode}
                                                    onChange={(e) => setIsDemoMode(e.target.checked)}
                                                    className="rounded bg-slate-950 border-slate-700 text-cyan-500 focus:ring-0"
                                                />
                                                <span className="text-slate-300">Force Client Demo Mode</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Chat Messages Log */}
                            <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                {messages.map((msg) => (
                                    <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>

                                        {/* System Notification */}
                                        {msg.sender === 'system' ? (
                                            <div className="mx-auto bg-slate-900 border border-slate-800 px-4 py-2 rounded-full text-xs font-mono text-cyan-400 flex items-center space-x-2">
                                                <Icon name="check-circle-2" size={14} />
                                                <span>{msg.text}</span>
                                            </div>
                                        ) : (
                                            /* Regular User / Assistant Message Bubble */
                                            <div className={`flex items-start space-x-3 max-w-3xl ${msg.sender === 'user' ? 'flex-row-reverse space-x-reverse' : ''}`}>

                                                {/* Avatar */}
                                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 text-white font-bold text-xs ${
                                                    msg.sender === 'user'
                                                        ? 'bg-indigo-600 shadow-md shadow-indigo-600/30'
                                                        : msg.isError
                                                            ? 'bg-red-600'
                                                            : 'bg-cyan-600 shadow-md shadow-cyan-600/30'
                                                }`}>
                                                    {msg.sender === 'user' ? <Icon name="user" size={16} /> : <Icon name="bot" size={16} />}
                                                </div>

                                                {/* Content Box */}
                                                <div className="flex flex-col">
                                                    <div className={`rounded-2xl p-4 text-sm leading-relaxed ${
                                                        msg.sender === 'user'
                                                            ? 'bg-indigo-600/90 text-white rounded-tr-none shadow-lg shadow-indigo-950/50'
                                                            : msg.isError
                                                                ? 'bg-red-950/40 border border-red-500/30 text-red-200 rounded-tl-none'
                                                                : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-tl-none shadow-xl'
                                                    }`}>
                                                        <p className="whitespace-pre-wrap">{msg.text}</p>

                                                        {/* Source Citations Badges */}
                                                        {msg.citations && msg.citations.length > 0 && (
                                                            <div className="mt-3 pt-3 border-t border-slate-800/80 flex flex-wrap items-center gap-1.5">
                                                                <span className="text-[11px] font-mono text-slate-400 flex items-center gap-1 mr-1">
                                                                    <Icon name="bookmark-check" size={12} className="text-cyan-400" />
                                                                    Citing Grounded Sources:
                                                                </span>
                                                                {msg.citations.map((page, idx) => (
                                                                    <span
                                                                        key={idx}
                                                                        className="px-2 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 font-mono text-xs hover:bg-cyan-900 transition cursor-pointer flex items-center gap-1"
                                                                        title={`Grounding verified from PDF Page ${page}`}
                                                                    >
                                                                        <Icon name="file-text" size={10} />
                                                                        Page {page}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* Timestamp */}
                                                    <span className={`text-[10px] text-slate-500 mt-1 font-mono ${msg.sender === 'user' ? 'text-right' : 'text-left'}`}>
                                                        {msg.timestamp}
                                                    </span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}

                                {/* Generating Indicator */}
                                {isGenerating && (
                                    <div className="flex items-start space-x-3">
                                        <div className="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center text-white shrink-0 shadow-md shadow-cyan-600/30">
                                            <Icon name="bot" size={16} />
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none p-4 flex items-center space-x-3">
                                            <div className="flex space-x-1.5">
                                                <div className="w-2 h-2 bg-cyan-400 rounded-full animate-bounce"></div>
                                                <div className="w-2 h-2 bg-cyan-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                                                <div className="w-2 h-2 bg-cyan-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                                            </div>
                                            <span className="text-xs text-slate-400 font-mono">
                                                Searching PostgreSQL vectors & querying Qwen 2.5...
                                            </span>
                                        </div>
                                    </div>
                                )}

                                <div ref={chatEndRef} />
                            </div>

                            {/* Query Input Footer */}
                            <footer className="p-4 bg-slate-900/90 border-t border-slate-800">
                                <form onSubmit={handleSendQuery} className="max-w-4xl mx-auto flex items-center space-x-2">
                                    <div className="relative flex-1">
                                        <input
                                            type="text"
                                            value={inputQuery}
                                            onChange={(e) => setInputQuery(e.target.value)}
                                            placeholder={activeDoc ? `Ask a question about ${activeDoc.filename}...` : "Please upload a PDF document to begin..."}
                                            disabled={!activeDoc || isGenerating}
                                            className="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition disabled:opacity-50 disabled:cursor-not-allowed pr-10"
                                        />
                                        <span className="absolute right-3 top-3.5 text-xs text-slate-600 font-mono hidden sm:inline">
                                            Enter ↵
                                        </span>
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={!activeDoc || !inputQuery.trim() || isGenerating}
                                        className="p-3 bg-gradient-to-tr from-cyan-500 to-indigo-600 text-white font-semibold rounded-xl hover:opacity-90 transition shadow-lg shadow-cyan-500/20 disabled:opacity-40 disabled:cursor-not-allowed shrink-0 flex items-center justify-center"
                                    >
                                        <Icon name="send" size={18} />
                                    </button>
                                </form>
                            </footer>
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
